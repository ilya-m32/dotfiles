# ==== Base settings
# use C-a, since it's on the home row and easier to hit than C-b
set-option -g prefix C-a
unbind-key C-a
bind-key C-a send-prefix

set -g base-index 1

# ==== Options
set -g mouse on
set -g default-shell /bin/zsh
set -g default-terminal 'tmux-256color'
set -as terminal-features ',*:RGB'
set -g focus-events on
# Allow the arrow key to be used immediately after changing windows
set -g repeat-time 0
set -g escape-time 0

# ==== Status bar + theme
set -g status-position top
set -g status-justify absolute-centre
set -g status-interval 1
set -g status-left-length 45
set -g status-right-length 45

set -g status-style bg=#1d1f21,fg=#969896
set -g status-left-style bg=#1d1f21,fg=#c5c8c6
set -g status-left "#[fg=#969896,bg=#1d1f21] %d-%m-%y "
set -g status-right-style bg=#1d1f21,fg=#c5c8c6
set -g status-right "#[fg=#969896,bg=#1d1f21] %H:%M:%S "

set -g window-status-format " #I:#W#F "
set -g window-status-current-format " #I:#W#F "
set -g window-status-current-style bg=#282a2e,fg=#c5c8c6
set -g window-status-activity-style bg=#1d1f21,fg=#969896
set -g window-status-separator ""

set -g pane-border-style bg=default,fg=colour238
set -g pane-active-border-style bg=default,fg=colour100

set -g display-panes-colour colour233
set -g display-panes-active-colour colour245
set -g display-panes-time 1500
set -g clock-mode-colour colour100
set -g clock-mode-style 24
set -g message-style bg=colour100,fg=black
set -g message-command-style bg=colour233,fg=black
set -g mode-style bg=colour100,fg=colour235

# ==== Windows and panes
set -g aggressive-resize on
set -g mode-keys vi
set -g automatic-rename on
set -g automatic-rename-format '#{?#{==:#{pane_current_path},#{HOME}},~,#{b:pane_current_path}}'
set -g allow-rename off
set -g other-pane-height 25
set -g other-pane-width 80
set -g monitor-activity on
set -g visual-activity on

# ==== Clipboard (OSC52, handled by the terminal)
set -g set-clipboard on

# ==== Bindings
bind-key space next-window
bind-key bspace previous-window
bind-key enter next-layout

bind-key v split-window -h -c "#{pane_current_path}"
bind-key s split-window -v -c "#{pane_current_path}"

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind-key + select-layout main-horizontal
bind-key = select-layout main-vertical

bind-key t next-window
bind-key T previous-window
bind-key f set -g status
bind-key L clear-history

# Smart pane switching with awareness of vim splits
%hidden is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\' 'select-pane -l'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
